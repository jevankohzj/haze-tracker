<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flower</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e8f4fb;
    }
    svg { width: min(90vw, 420px); height: auto; }
  </style>
</head>
<body>
  <svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A pink flower with a green stem and two leaves">
    <!-- stem -->
    <path d="M100 120 C95 180 105 230 100 290" fill="none" stroke="#3a8f3a" stroke-width="6" stroke-linecap="round"/>
    <!-- leaves -->
    <path d="M100 220 C70 210 55 185 50 170 C80 170 98 190 100 220 Z" fill="#4caf50"/>
    <path d="M101 190 C130 180 145 155 150 140 C120 140 102 160 101 190 Z" fill="#4caf50"/>
    <!-- petals: one ellipse rotated 8 times around the center -->
    <g transform="translate(100 80)" fill="#f48fb1" stroke="#d81b60" stroke-width="1.5">
      <ellipse cx="0" cy="-32" rx="14" ry="28"/>
      <ellipse cx="0" cy="-32" rx="14" ry="28" transform="rotate(45)"/>
      <ellipse cx="0" cy="-32" rx="14" ry="28" transform="rotate(90)"/>
      <ellipse cx="0" cy="-32" rx="14" ry="28" transform="rotate(135)"/>
      <ellipse cx="0" cy="-32" rx="14" ry="28" transform="rotate(180)"/>
      <ellipse cx="0" cy="-32" rx="14" ry="28" transform="rotate(225)"/>
      <ellipse cx="0" cy="-32" rx="14" ry="28" transform="rotate(270)"/>
      <ellipse cx="0" cy="-32" rx="14" ry="28" transform="rotate(315)"/>
      <!-- center -->
      <circle r="16" fill="#ffd54f" stroke="#f9a825" stroke-width="2"/>
    </g>
  </svg>
</body>
</html>
